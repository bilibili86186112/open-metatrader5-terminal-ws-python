# 用法：
#   cp .env.example .env      # 填入账号密码
#
# ① 全屏 TUI（最常用）
#   docker compose run --rm tui
#
# ② 命令行
#   docker compose run --rm mt5 account
#   docker compose run --rm -it mt5                 # 交互 REPL
#
# ③ 常驻看板（每 60 秒打印账户 + 持仓）
#   docker compose up watch

services:
  # 全屏终端界面：必须有 TTY
  tui:
    build: .
    image: mt5ws:1.0.0
    env_file: [.env]
    entrypoint: ["mt5tui"]
    stdin_open: true
    tty: true
    # 自选品种与刷新间隔可按需覆盖：
    #   docker compose run --rm tui --watch XAUUSDm,GBPUSDm --interval 2
    command: ["--watch", "XAUUSDm,EURUSDm,GBPUSDm", "--interval", "1"]

  # 命令行（一次性命令 / 交互）
  mt5:
    build: .
    image: mt5ws:1.0.0
    env_file: [.env]
    stdin_open: true
    tty: true

  # 常驻看板
  watch:
    build: .
    image: mt5ws:1.0.0
    env_file: [.env]
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          echo "──── $(date -u '+%Y-%m-%d %H:%M:%S') UTC ────"
          mt5cli account || true
          echo
          mt5cli positions 2>/dev/null | head -12 || true
          echo
          sleep 60
        done
    restart: unless-stopped
